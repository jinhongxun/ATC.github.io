<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大兴塔台 · 执勤卡片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#f0f2f5;color:#333;line-height:1.6}

.hero{
  background:linear-gradient(135deg,#0f2a44 0%,#1a4a7a 50%,#2d6a9f 100%);
  color:#fff;padding:60px 24px 40px;text-align:center;
  position:relative;overflow:hidden
}
.hero::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:4px;background:linear-gradient(90deg,#e15759,#edc948,#4e79a7,#76b7b2)
}
.hero h1{font-size:30px;font-weight:700;letter-spacing:3px}
.hero .desc{font-size:14px;margin-top:8px;opacity:.75}

.container{max-width:960px;margin:0 auto;padding:32px 16px}

.section{margin-bottom:32px}
.section h2{
  font-size:18px;color:#1a3a5c;margin-bottom:16px;
  padding-bottom:8px;border-bottom:2px solid #e8ecf0;
  display:flex;align-items:center;gap:8px
}
.section h2::before{
  content:'';display:inline-block;width:4px;height:20px;
  background:#2d6a9f;border-radius:2px
}

.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.tool-card{
  background:#fff;border-radius:10px;padding:20px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  transition:transform .15s,box-shadow .15s;
  cursor:pointer;text-decoration:none;display:block;color:#333
}
.tool-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.tool-card .icon{font-size:28px;margin-bottom:10px}
.tool-card h3{font-size:16px;color:#1a3a5c;margin-bottom:4px}
.tool-card p{font-size:13px;color:#888}
.tool-card .date{font-size:11px;color:#bbb;margin-top:8px}

.footer{text-align:center;padding:24px;color:#bbb;font-size:12px}

@media(max-width:600px){
  .hero{padding:40px 16px 30px}
  .hero h1{font-size:24px}
  .tools-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="hero">
  <h1>大兴塔台 · 执勤卡片</h1>
  <div class="desc">塔台一室 · 当日排班查询</div>
</div>

<div class="container">

  <div class="section">
    <h2>执勤卡片</h2>
    <div class="tools-grid">
      <a href="duty-cards/0524.html" class="tool-card">
        <div class="icon">📋</div>
        <h3>5月24日 · 执勤卡片</h3>
        <p>输入姓名搜索查看个人当日排班详情（时段、席位、甘特图）</p>
        <div class="date">2026年5月24日</div>
      </a>
    </div>
  </div>

</div>

<div class="footer">
  &copy; 2026 &nbsp;|&nbsp; Powered by GitHub Pages
</div>

</body>
</html>
