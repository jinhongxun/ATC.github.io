<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大兴塔台 · 执勤卡片</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
            background:#f0f2f5;
            color:#333;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:24px
        }
        .container{
            max-width:560px;
            width:100%
        }
        .hero{
            background:linear-gradient(135deg,#1a3a5c 0%,#2d6a9f 100%);
            color:#fff;
            border-radius:14px;
            padding:40px 36px;
            text-align:center;
            box-shadow:0 4px 20px rgba(26,58,92,.2);
            margin-bottom:20px
        }
        .hero .icon{font-size:48px;margin-bottom:12px}
        .hero h1{font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:1px}
        .hero .sub{font-size:14px;opacity:.85;margin-bottom:4px}
        .hero .badge{
            display:inline-block;
            background:rgba(255,255,255,.15);
            border:1px solid rgba(255,255,255,.25);
            border-radius:20px;
            padding:4px 14px;
            font-size:12px;
            margin-top:10px
        }
        .card{
            background:#fff;
            border-radius:10px;
            box-shadow:0 1px 4px rgba(0,0,0,.08);
            padding:28px 32px;
            transition:box-shadow .2s
        }
        .card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
        .card h2{font-size:16px;color:#1a3a5c;margin-bottom:16px;font-weight:600}
        .entry{
            display:flex;
            align-items:center;
            gap:14px;
            padding:14px 16px;
            background:#f8f9fb;
            border-radius:8px;
            text-decoration:none;
            transition:background .2s
        }
        .entry:hover{background:#e3f0fa}
        .entry .info{flex:1}
        .entry .info .title{font-size:15px;font-weight:600;color:#1a3a5c}
        .entry .info .desc{font-size:12px;color:#888;margin-top:3px}
        .entry .arrow{font-size:18px;color:#2d6a9f}
        .footer{
            text-align:center;
            color:#bbb;
            font-size:11px;
            padding:20px 0 8px
        }
        @media(max-width:480px){
            .hero{padding:32px 24px}
            .hero h1{font-size:22px}
            .card{padding:20px}
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="icon">🏢</div>
            <h1>大兴塔台管制室</h1>
            <p class="sub">执勤卡片 · 快速查阅</p>
            <div class="badge">📅 2024年5月 · 塔台一室</div>
        </div>
        <div class="card">
            <h2>📋 执勤信息</h2>
            <a class="entry" href="./执勤卡片0524.html">
                <div class="info">
                    <div class="title">执勤卡片（5月24日）</div>
                    <div class="desc">查看当日所有执勤人员、席位时段、工时统计与备份信息</div>
                </div>
                <div class="arrow">→</div>
            </a>
        </div>
        <div class="footer">大兴塔台一室 · 内部使用</div>
    </div>
</body>
</html>
