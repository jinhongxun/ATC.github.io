<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大兴塔台 · 执勤卡片系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body{
            font-family:"Inter","Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
            background:#0a1628;
            color:#e8edf5;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:24px;
            position:relative;
            overflow-x:hidden
        }
        /* Animated background grid */
        body::before{
            content:'';
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:
                linear-gradient(rgba(45,106,159,.03) 1px,transparent 1px),
                linear-gradient(90deg,rgba(45,106,159,.03) 1px,transparent 1px);
            background-size:60px 60px;
            z-index:0;
            pointer-events:none
        }
        /* Glow orbs */
        .orb{
            position:fixed;
            border-radius:50%;
            filter:blur(80px);
            pointer-events:none;
            z-index:0
        }
        .orb-1{
            top:-200px;right:-150px;
            width:500px;height:500px;
            background:radial-gradient(circle,rgba(45,106,159,.15),transparent 70%)
        }
        .orb-2{
            bottom:-200px;left:-150px;
            width:450px;height:450px;
            background:radial-gradient(circle,rgba(26,58,92,.2),transparent 70%)
        }
        .container{
            max-width:620px;
            width:100%;
            position:relative;
            z-index:1
        }
        .hero{
            position:relative;
            background:linear-gradient(145deg,#0f1f35 0%,#162d4e 30%,#1a3a5c 60%,#0f1f35 100%);
            border:1px solid rgba(45,106,159,.2);
            border-radius:20px;
            padding:52px 44px 44px;
            text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
            margin-bottom:24px;
            overflow:hidden
        }
        .hero::after{
            content:'';
            position:absolute;
            top:0;left:0;right:0;height:1px;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)
        }
        .hero .emblem{
            width:72px;height:72px;
            margin:0 auto 18px;
            background:linear-gradient(135deg,#2d6a9f,#1a3a5c);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:32px;
            border:2px solid rgba(255,255,255,.1);
            box-shadow:0 8px 24px rgba(45,106,159,.3)
        }
        .hero h1{
            font-size:28px;
            font-weight:700;
            letter-spacing:2px;
            background:linear-gradient(135deg,#fff 40%,#8ab4d6);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            margin-bottom:6px
        }
        .hero .subtitle{
            font-size:14px;
            color:rgba(255,255,255,.5);
            font-weight:400;
            letter-spacing:4px;
            margin-bottom:16px;
            text-transform:uppercase
        }
        .hero .divider{
            width:60px;height:2px;
            background:linear-gradient(90deg,transparent,#2d6a9f,transparent);
            margin:0 auto 16px;
            border-radius:1px
        }
        .hero .desc{
            font-size:14px;
            color:rgba(255,255,255,.6);
            line-height:1.7;
            max-width:400px;
            margin:0 auto
        }
        .hero .meta-row{
            display:flex;
            justify-content:center;
            gap:24px;
            margin-top:20px;
            flex-wrap:wrap
        }
        .hero .meta-item{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:12px;
            color:rgba(255,255,255,.4);
            letter-spacing:1px
        }
        .hero .meta-item .dot{
            width:5px;height:5px;
            border-radius:50%;
            background:#2d6a9f
        }
        .card{
            background:linear-gradient(145deg,#111e32,#0d1828);
            border:1px solid rgba(45,106,159,.12);
            border-radius:16px;
            padding:4px;
            transition:all .3s ease
        }
        .card:hover{
            border-color:rgba(45,106,159,.3);
            box-shadow:0 8px 32px rgba(0,0,0,.3);
            transform:translateY(-2px)
        }
        .card-inner{
            background:linear-gradient(145deg,#132238,#0e1b2d);
            border-radius:14px;
            padding:24px 28px;
            display:flex;
            align-items:center;
            gap:18px;
            text-decoration:none;
            transition:background .3s
        }
        .card-inner:hover{background:linear-gradient(145deg,#162d4e,#132238)}
        .card-icon{
            width:52px;height:52px;
            background:linear-gradient(135deg,rgba(45,106,159,.2),rgba(45,106,159,.05));
            border:1px solid rgba(45,106,159,.2);
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            flex-shrink:0
        }
        .card-info{flex:1;min-width:0}
        .card-info .title{
            font-size:16px;
            font-weight:600;
            color:#e8edf5;
            margin-bottom:3px
        }
        .card-info .desc{
            font-size:12px;
            color:rgba(255,255,255,.4);
            line-height:1.5
        }
        .card-arrow{
            font-size:20px;
            color:rgba(255,255,255,.15);
            flex-shrink:0;
            transition:all .3s
        }
        .card:hover .card-arrow{
            color:rgba(255,255,255,.5);
            transform:translateX(4px)
        }
        .footer{
            text-align:center;
            color:rgba(255,255,255,.15);
            font-size:11px;
            padding:16px 0 4px;
            letter-spacing:2px;
            position:relative;
            z-index:1
        }
        @keyframes fadeUp{
            from{opacity:0;transform:translateY(20px)}
            to{opacity:1;transform:translateY(0)}
        }
        .hero{animation:fadeUp .6s ease-out}
        .card{animation:fadeUp .6s ease-out .15s both}
        .footer{animation:fadeUp .6s ease-out .3s both}
        @media(max-width:520px){
            .hero{padding:36px 24px 32px}
            .hero h1{font-size:22px}
            .card-inner{padding:18px 20px;flex-wrap:wrap}
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="container">
        <div class="hero">
            <div class="emblem">✈</div>
            <h1>大兴塔台管制室</h1>
            <div class="subtitle">Daxing Tower · ATC</div>
            <div class="divider"></div>
            <p class="desc">执勤卡片电子化管理系统<br>实时查询人员排班、席位分配与执勤信息</p>
            <div class="meta-row">
                <span class="meta-item"><span class="dot"></span> 塔台一室</span>
                <span class="meta-item"><span class="dot"></span> 2024年5月</span>
                <span class="meta-item"><span class="dot"></span> 内部系统</span>
            </div>
        </div>
        <div class="card">
            <a class="card-inner" href="./执勤卡片0524.html">
                <div class="card-icon">📋</div>
                <div class="card-info">
                    <div class="title">执勤卡片 · 5月24日</div>
                    <div class="desc">查看当日全体执勤人员席位时段、工时统计与备份安排</div>
                </div>
                <div class="card-arrow">→</div>
            </a>
        </div>
        <div class="footer">DAXING TOWER · INTERNAL USE ONLY</div>
    </div>
</body>
</html>
